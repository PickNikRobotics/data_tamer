name: foxglove

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foxglove:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data_tamer_foxglove
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: data_tamer_foxglove/package-lock.json
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: npm ci
    - run: npm run typecheck
    - run: npm test
    - run: python3 ../tools/check_versions.py
