
name: cmake Ubuntu

on: [push, pull_request]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
    - uses: actions/checkout@v2

    # ubuntu 24.04 doesn't allow non-user pip install by default anymore
    # don't do this on your host computer, but this is fine in CI
    - name: pip break system packages
      if: matrix.os == 'ubuntu-24.04'
      run: python3 -m pip config set global.break-system-packages true

    - name: Install Conan
      id: conan
      uses: turtlebrowser/get-conan@main
      with:
        version: 2.27.1   # the mcap recipe needs conan >= 2.4

    - name: Create default profile
      run: conan profile detect

    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Install conan dependencies
      working-directory: ${{github.workspace}}/build
      run: conan install ${{github.workspace}}/data_tamer_cpp/conanfile.py -s build_type=Debug --build=missing -s compiler.cppstd=gnu17 -of .

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cmake ${{github.workspace}}/data_tamer_cpp -DCMAKE_BUILD_TYPE=Debug -DDATA_TAMER_WERROR=ON -DDATA_TAMER_USE_SYSTEM_MCAP=ON -DCMAKE_TOOLCHAIN_FILE="./build/Debug/generators/conan_toolchain.cmake" -DCMAKE_CXX_FLAGS_DEBUG="-g -fprofile-arcs -ftest-coverage"

    - name: Build
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cmake --build . --config Debug

    - name: run test (Linux)
      working-directory: ${{github.workspace}}/build
      run: ctest -T test -T Coverage

    # Packages the library with conan and builds test_package/ against it.
    - name: conan create
      run: >
        conan create ${{github.workspace}}/data_tamer_cpp --build=missing
        -s build_type=Release -o "data_tamer/*:tests=False" -o "data_tamer/*:examples=False"

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ${{github.workspace}}/build
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Installs a static and a shared build (MCAP downloaded, zstd and lz4 from apt) and builds
  # test_package/, a find_package(data_tamer 2) consumer, against each.
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        shared: ['OFF', 'ON']
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libzstd-dev liblz4-dev

    - name: Build and install the library
      run: |
        cmake -S data_tamer_cpp -B build -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DDATA_TAMER_WERROR=ON \
          -DDATA_TAMER_BUILD_TESTS=OFF -DDATA_TAMER_BUILD_EXAMPLES=OFF \
          -DDATA_TAMER_BUILD_BENCHMARKS=OFF
        cmake --build build -j4
        cmake --install build --prefix "$RUNNER_TEMP/prefix"

    - name: Build and run a consumer
      run: |
        cmake -S data_tamer_cpp/test_package -B build_consumer \
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix"
        cmake --build build_consumer
        build_consumer/test_package
