name: ros2

on: [push, pull_request]

jobs:
  industrial_ci:
    strategy:
      fail-fast: false  # one distro's infrastructure failure must not cancel the others
      matrix:
        env:
          - {ROS_DISTRO: humble, ROS_REPO: main}
          - {ROS_DISTRO: jazzy, ROS_REPO: main}
          - {ROS_DISTRO: lyrical, ROS_REPO: main}
          # industrial_ci defaults rolling to Ubuntu 26.04 (resolute), for which
          # packages.ros.org publishes no ros-rolling-* binaries yet; pin to noble.
          - {ROS_DISTRO: rolling, ROS_REPO: main, OS_CODE_NAME: noble}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 'ros-industrial/industrial_ci@master'
        env: ${{matrix.env}}
